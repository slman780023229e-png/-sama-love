<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة سما وسلمان - شات واتساب الملكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- واجهة الغزل والمملكة الرئيسية --- */
        #homeMainView {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #4c0519, #881337, #1e1b4b);
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0; left: 0; width: 100%; z-index: 500;
        }
        .home-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 35px;
            border: 3px solid #fb7185;
            box-shadow: 0 0 50px rgba(251, 113, 133, 0.3);
            max-width: 520px;
            width: 100%;
        }
        .home-card h1 { font-size: 28px; font-weight: 900; color: #fda4af; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(225,29,72,0.5); }
        .home-card p { font-size: 16px; font-weight: 700; color: #fecdd3; margin-bottom: 25px; line-height: 1.8; }
        .enter-chat-btn {
            background: linear-gradient(135deg, #00a884, #005c4b);
            color: #fff;
            border: none;
            padding: 16px 30px;
            border-radius: 35px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,168,132,0.4);
            transition: 0.3s;
            width: 100%;
        }
        .enter-chat-btn:hover { transform: scale(1.04); background: linear-gradient(135deg, #00bf9a, #006b57); }

        /* --- واجهة واتساب الكاملة (عند الضغط للدخول) --- */
        #whatsappBox {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #0b141a;
            position: absolute;
            top: 0; left: 0; z-index: 1000;
        }
        .wa-chat-header {
            background: #1f2c34;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
            height: 75px;
        }
        .wa-avatar-box { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .wa-avatar {
            width: 48px; height: 48px; background: linear-gradient(135deg, #00a884, #005c4b); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 10px rgba(0,168,132,0.4);
        }
        .wa-chat-info { display: flex; flex-direction: column; }
        .wa-title-name { color: #fff; font-weight: 900; font-size: 15px; }
        .wa-status-text { font-size: 12px; color: #00a884; font-weight: 700; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .wa-controls { display: flex; gap: 8px; }
        .wa-control-btn {
            background: #2a3942;
            color: #e9edef;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .wa-control-btn:hover { background: #374248; }

        .wa-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0b141a;
            background-image: radial-gradient(#1f2c34 1.2px, transparent 1.2px);
            background-size: 26px 26px;
        }
        .wa-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 14px;
            position: relative;
            font-size: 15px;
            font-weight: 700;
            word-wrap: break-word;
        }
        .wa-bubble.incoming { background: #202c33; align-self: flex-start; border-top-right-radius: 4px; color: #e9edef; border-right: 4px solid #00a884; }
        .wa-bubble.outgoing { background: #005c4b; align-self: flex-end; border-top-left-radius: 4px; color: #e9edef; border-left: 4px solid #00a884; }
        .wa-sender-name { font-size: 11px; color: #00a884; font-weight: 900; margin-bottom: 3px; }
        
        .wa-msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 4px; }
        .wa-time { font-size: 10px; color: #8696a0; }
        .wa-ticks { font-size: 12px; font-weight: 900; color: #53bdeb; }

        .wa-input-footer {
            background: #202c33;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #222d34;
        }
        .wa-input-footer input {
            flex: 1;
            padding: 12px 18px;
            background: #2a3942;
            border: 2px solid transparent;
            color: #fff;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .wa-input-footer input:focus { border-color: #00a884; background: #111b21; }
        .wa-send-btn {
            background: #00a884;
            color: #fff;
            border: none;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        /* نافذة إدخال الاسم فقط (أول مرة) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-card {
            background: #1e1b4b; padding: 30px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center; border: 3px solid #fb7185; box-shadow: 0 0 30px rgba(251,113,133,0.3);
        }
        .modal-card h3 { color: #fda4af; font-size: 20px; margin-bottom: 12px; font-weight: 900; }
        .modal-card input, .modal-card select { width: 100%; padding: 12px; border: 2px solid #fb7185; border-radius: 20px; text-align: center; font-size: 15px; margin-bottom: 15px; outline: none; background: #0f172a; color: #fff; font-family: 'Cairo', sans-serif; }
        .modal-btn { background: linear-gradient(135deg, #e11d48, #db2777); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 25px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية الكلاسيكية مع الغزل والتفاصيل السابقة -->
    <div id="homeMainView">
        <div class="home-card">
            <h1>👑 مملكة العشق والصفاء</h1>
            <p>حيث يلتقي نبض سلمان بسما في واحة من الجمال والأحاسيس الراقية... اضغط أدناه للانتقال لغرفة الشات الخاصة بكم.</p>
            <button class="enter-chat-btn" onclick="checkNameAndOpenChat()">💬 الدخول إلى غرفة الشات (واتساب)</button>
        </div>
    </div>

    <!-- واجهة واتساب الكاملة -->
    <div id="whatsappBox">
        <div class="wa-chat-header">
            <div class="wa-avatar-box" onclick="openProfileModal()" title="اضغط لتعديل بروفايلك وحالتك">
                <div id="headerUserAvatar" class="wa-avatar">👑</div>
                <div class="wa-chat-info">
                    <div class="wa-title-name">مملكة سلمان وسما 🩷</div>
                    <div id="onlineStatusText" class="wa-status-text">● متصل الآن...</div>
                </div>
            </div>
            <div class="wa-controls">
                <button class="wa-control-btn" onclick="openProfileModal()">👤 بروفايلي</button>
                <button class="wa-control-btn" onclick="exitToHome()">🏠 الرئيسية</button>
            </div>
        </div>

        <div id="waMessagesList" class="wa-messages-area"></div>

        <div class="wa-input-footer">
            <input type="text" id="waText" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button class="wa-send-btn" onclick="sendWhatsAppMessage()">➤</button>
        </div>
    </div>

    <!-- نافذة إدخال الاسم (تظهر أول مرة فقط بدون كلمة سر معقدة) -->
    <div id="nameModal" class="modal-overlay">
        <div class="modal-card">
            <h3>✨ من أنتَ / من أنتِ؟</h3>
            <p style="font-size: 13px; margin-bottom: 12px; color: #fecdd3; font-weight: 700;">أدخل اسمك (سلمان أو سما):</p>
            <input type="text" id="myNameInput" placeholder="اكتب اسمك هنا...">
            <button class="modal-btn" onclick="saveMyName()">دخول المملكة 🚀</button>
        </div>
    </div>

    <!-- نافذة تعديل البروفايل والحالة الشخصية -->
    <div id="profileModal" class="modal-overlay">
        <div class="modal-card">
            <h3>👤 تعديل البروفايل والحالة</h3>
            <p style="font-size: 12px; color: #fecdd3; font-weight: 700; margin-bottom: 5px; text-align: right;">اسمك:</p>
            <input type="text" id="editProfileName" placeholder="اسمك...">
            
            <p style="font-size: 12px; color: #fecdd3; font-weight: 700; margin-bottom: 5px; text-align: right;">حالتك الشخصية (Bio):</p>
            <input type="text" id="editProfileStatus" placeholder="مثلاً: متواجد في مملكة العشق 👑">

            <p style="font-size: 12px; color: #fecdd3; font-weight: 700; margin-bottom: 5px; text-align: right;">الأيقونة:</p>
            <select id="editProfileAvatar">
                <option value="👑">👑 تاج الملك</option>
                <option value="🩷">🩷 قلب وردي</option>
                <option value="🌹">🌹 وردة حمراء</option>
                <option value="✨">✨ نجمة متألقة</option>
            </select>

            <button class="modal-btn" onclick="saveProfileChanges()" style="margin-top: 10px;">حفظ التغييرات ✨</button>
            <button style="background: none; border: none; color: #888; margin-top: 10px; cursor: pointer; font-weight: 700;" onclick="closeProfileModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const chatChannel = "sama_royal_sanctuary_chat_room_99";
        const apiUrl = "https://ntfy.sh/" + chatChannel;

        function checkNameAndOpenChat() {
            if(!localStorage.getItem('sama_chat_user_name')) {
                document.getElementById('nameModal').style.display = 'flex';
            } else {
                launchWhatsAppFullscreen();
            }
        }

        function saveMyName() {
            const nameVal = document.getElementById('myNameInput').value.trim();
            if(!nameVal) { alert('الرجاء كتابة اسمك!'); return; }
            localStorage.setItem('sama_chat_user_name', nameVal);
            localStorage.setItem('sama_chat_user_status', 'متصل في مملكة العشق 🩷');
            localStorage.setItem('sama_chat_user_avatar', '👑');
            document.getElementById('nameModal').style.display = 'none';
            launchWhatsAppFullscreen();
        }

        function launchWhatsAppFullscreen() {
            document.getElementById('homeMainView').style.display = 'none';
            document.getElementById('whatsappBox').style.display = 'flex';
            updateHeaderProfileUI();
            loadSavedMessages();
            startListeningMessages();
        }

        function exitToHome() {
            document.getElementById('whatsappBox').style.display = 'none';
            document.getElementById('homeMainView').style.display = 'flex';
        }

        function openProfileModal() {
            document.getElementById('editProfileName').value = localStorage.getItem('sama_chat_user_name') || '';
            document.getElementById('editProfileStatus').value = localStorage.getItem('sama_chat_user_status') || '';
            document.getElementById('editProfileAvatar').value = localStorage.getItem('sama_chat_user_avatar') || '👑';
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

        function saveProfileChanges() {
            localStorage.setItem('sama_chat_user_name', document.getElementById('editProfileName').value);
            localStorage.setItem('sama_chat_user_status', document.getElementById('editProfileStatus').value);
            localStorage.setItem('sama_chat_user_avatar', document.getElementById('editProfileAvatar').value);
            closeProfileModal();
            updateHeaderProfileUI();
        }

        function updateHeaderProfileUI() {
            document.getElementById('headerUserAvatar').innerText = localStorage.getItem('sama_chat_user_avatar') || '👑';
            document.getElementById('onlineStatusText').innerText = '● ' + (localStorage.getItem('sama_chat_user_status') || 'متصل الآن');
        }

        function loadSavedMessages() {
            const saved = JSON.parse(localStorage.getItem('sama_saved_chat_history') || '[]');
            const listDiv = document.getElementById('waMessagesList');
            listDiv.innerHTML = '';
            saved.forEach(msg => renderBubble(msg));
        }

        function renderBubble(msg) {
            const listDiv = document.getElementById('waMessagesList');
            const myName = localStorage.getItem('sama_chat_user_name');
            const isMe = (msg.sender === myName);

            let div = document.createElement('div');
            div.className = `wa-bubble ${isMe ? 'outgoing' : 'incoming'}`;
            div.innerHTML = `
                <div class="wa-sender-name">${msg.sender}</div>
                <div>${msg.text}</div>
                <div class="wa-msg-footer">
                    <span class="wa-time">${msg.time}</span>
                    <span class="wa-ticks">✓✓</span>
                </div>
            `;
            listDiv.appendChild(div);
            listDiv.scrollTop = listDiv.scrollHeight;
        }

        function sendWhatsAppMessage() {
            const textInput = document.getElementById('waText');
            const text = textInput.value.trim();
            if(!text) return;

            const msgObj = {
                sender: localStorage.getItem('sama_chat_user_name'),
                text: text,
                time: new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
            };

            let saved = JSON.parse(localStorage.getItem('sama_saved_chat_history') || '[]');
            saved.push(msgObj);
            localStorage.setItem('sama_saved_chat_history', JSON.stringify(saved));

            renderBubble(msgObj);
            textInput.value = '';

            fetch(apiUrl, { method: 'POST', body: JSON.stringify(msgObj) }).catch(e => {});
        }

        function startListeningMessages() {
            try {
                const eventSource = new EventSource(apiUrl + "/sse");
                eventSource.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.message) {
                        const parsed = JSON.parse(data.message);
                        if(parsed.sender !== localStorage.getItem('sama_chat_user_name')) {
                            let saved = JSON.parse(localStorage.getItem('sama_saved_chat_history') || '[]');
                            saved.push(parsed);
                            localStorage.setItem('sama_saved_chat_history', JSON.stringify(saved));
                            renderBubble(parsed);
                        }
                    }
                };
            } catch(e) {}
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendWhatsAppMessage(); }
    </script>
</body>
</html>
